name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint & import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-silero.txt

      - name: Install minimal deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # Keep CI light: core deps only (no Whisper model download)
          pip install \
            "fastapi>=0.115.0" \
            "uvicorn[standard]>=0.32.0" \
            "pydantic>=2.0.0" \
            "pydantic-settings>=2.0.0" \
            "python-multipart>=0.0.12" \
            "python-dotenv>=1.0.0" \
            "jinja2>=3.1.0" \
            "requests>=2.32.0" \
            "numpy>=1.24.0"

      - name: Ruff
        run: ruff check app

      - name: Import smoke
        run: python -c "from app.main import app; print(app.title)"

      - name: Pytest (if present)
        run: |
          if [ -d tests ] || ls test_*.py 2>/dev/null; then
            pytest -q
          else
            echo "No tests yet — skipped"
          fi

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci || npm install
      - run: npm run build

  docker:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
