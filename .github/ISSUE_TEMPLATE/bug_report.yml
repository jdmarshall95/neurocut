name: Bug report
description: Something broken in API, UI, pipeline, or Premiere plugin
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. Choose task …
        3. Upload …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / pipeline
        - Frontend UI
        - STT / transcription
        - Scene detection
        - Export (XML / clips / render)
        - Subtitles
        - Premiere plugin
        - Docker / install
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: main @ abc1234 or tag v0.x
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS:
        Docker version:
        STT_ENGINE / LLM_PROVIDER:
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact API keys. Paste relevant docker / API logs.
